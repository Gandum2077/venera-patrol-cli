name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: venera-patrol-cli
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts && npm rebuild better-sqlite3 && npm run check && npm test
        working-directory: venera-patrol-cli
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: venera-patrol-cli
